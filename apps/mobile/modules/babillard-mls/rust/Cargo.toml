[package]
name = "babillard_mls"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-or-later"
publish = false

[lib]
# cdylib is what Android loads. lib lets the tests and the binding generator link it.
crate-type = ["cdylib", "lib"]

[dependencies]
# Exact versions: an upgrade here changes the code that protects every message, so it's a deliberate edit.
openmls = "=0.9.2"
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
thiserror = "2"
uniffi = "=0.32.2"

[features]
# Only the binding generator needs uniffi's command-line tools.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[profile.release]
lto = true
codegen-units = 1
strip = true
