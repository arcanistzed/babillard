packages:
  - apps/*
  - packages/*

# React Native's Gradle and Metro tooling expects a flat node_modules.
nodeLinker: hoisted

# Security fixes for build tools whose parents still pin vulnerable versions. Drop each line once
# the parent's own range allows the patched version.
overrides:
  # GHSA-g3hv-75wg-m249, via @expo/fingerprint and glob
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
  # GHSA-3g3m-2fjr-6pw4, via @expo/cli
  "glob@>=9.0.0 <=14.0.1": ^14.0.2
  # GHSA-67mh-4wv8-2f99, via drizzle-kit's @esbuild-kit/esm-loader
  "esbuild@<=0.24.2": ^0.25.0

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
